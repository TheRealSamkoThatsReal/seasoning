[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seasoning"
version = "0.1.0"
description = "Seasonal snow, leaves and petals that fall on your desktop and pile up on your windows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
    "glfw>=2.7; sys_platform == 'win32'",
    "pystray>=0.19; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
seasoning = "seasoning.__main__:main"

[project.urls]
Homepage = "https://github.com/TheRealSamkoThatsReal/seasoning"

[tool.setuptools]
packages = ["seasoning"]
