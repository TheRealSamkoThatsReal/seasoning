<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo">❄</span>
    <span class="name">seasoning</span>
    <label class="switch" title="On / off everywhere">
      <input type="checkbox" id="enabled"><span></span>
    </label>
  </header>

  <div id="sync" class="sync" hidden>Synced with the seasoning desktop app</div>

  <label class="row">Season
    <select id="season">
      <option value="auto">Follow the calendar</option>
      <option value="winter">Winter · snow</option>
      <option value="spring">Spring · petals</option>
      <option value="summer">Summer · fluff</option>
      <option value="fall">Fall · leaves</option>
    </select>
  </label>

  <label class="row">Amount
    <input type="range" id="intensity" min="0" max="3" step="0.05">
  </label>

  <label class="row">Wind
    <input type="range" id="windx" min="-1" max="1" step="0.05">
  </label>

  <label class="check"><input type="checkbox" id="piles"> Pile up on page elements</label>
  <label class="check"><input type="checkbox" id="site"> On this site</label>
  <label class="check"><input type="checkbox" id="companion"> Sync with the desktop app</label>

  <div class="buttons">
    <button id="clear">Clear piles</button>
  </div>
  <footer id="stats"></footer>
  <script src="popup.js"></script>
</body>
</html>
