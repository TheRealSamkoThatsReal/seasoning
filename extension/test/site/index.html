<!doctype html><html><head><meta charset="utf-8"><title>seasoning test page</title>
<style>
 body{margin:0;font:15px system-ui;background:#1d2230;color:#dde}
 nav{position:fixed;top:0;left:0;right:0;height:52px;background:#2b3245;display:flex;align-items:center;padding:0 20px;z-index:10}
 main{padding:120px 60px 2000px;display:grid;grid-template-columns:repeat(3,320px);gap:40px}
 .card{background:#2f3850;border-radius:14px;height:200px;padding:16px}
 .btn{display:inline-block;margin-top:20px;background:#3d6ad6;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px}
 .drop{position:absolute;top:150px;left:120px;width:220px;height:120px;background:#5b3a6e;border-radius:6px;z-index:5}
 img{width:320px;height:180px;display:block;border-radius:4px}
 .plain{height:120px}
</style></head><body>
<nav>seasoning test · fixed nav</nav>
<div class="drop">dropdown covering part of a card</div>
<main>
 <div class="card">Card A<br><button class="btn">Button</button></div>
 <div class="card">Card B</div>
 <img alt="" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='180'><rect width='320' height='180' fill='%23557799'/></svg>">
 <div class="plain">a transparent div (no snow)</div>
 <div class="card">Card C</div>
 <div class="card">Card D</div>
</main></body></html>
